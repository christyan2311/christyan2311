<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C6A664"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Window background -->
  <rect width="820" height="340" rx="12" fill="url(#bg)"/>

  <!-- Title bar -->
  <rect width="820" height="40" rx="12" fill="#11111b"/>
  <rect y="28" width="820" height="12" fill="#11111b"/>
  <!-- Traffic lights -->
  <circle cx="22" cy="20" r="7" fill="#ed8796"/>
  <circle cx="44" cy="20" r="7" fill="#eed49f"/>
  <circle cx="66" cy="20" r="7" fill="#a6da95"/>
  <!-- Tab bar -->
  <rect x="100" y="0" width="180" height="40" fill="#1e1e2e"/>
  <text x="190" y="25" font-family="monospace" font-size="13" fill="#C6A664" text-anchor="middle">README.md</text>
  <rect x="280" y="0" width="180" height="40" fill="#11111b"/>
  <text x="370" y="25" font-family="monospace" font-size="13" fill="#6c7086" text-anchor="middle">profile.ts</text>

  <!-- Sidebar -->
  <rect x="0" y="40" width="48" height="300" fill="#11111b"/>
  <!-- Sidebar icons -->
  <rect x="12" y="60" width="24" height="24" rx="4" fill="none" stroke="#6c7086" stroke-width="2"/>
  <rect x="12" y="100" width="24" height="24" rx="4" fill="none" stroke="#6c7086" stroke-width="2"/>
  <circle cx="24" cy="140" r="12" fill="none" stroke="#C6A664" stroke-width="2"/>
  <rect x="12" y="180" width="24" height="24" rx="4" fill="none" stroke="#6c7086" stroke-width="2"/>
  <rect x="12" y="220" width="24" height="24" rx="4" fill="none" stroke="#6c7086" stroke-width="2"/>

  <!-- Line numbers gutter -->
  <text x="64" y="80" font-family="monospace" font-size="12" fill="#45475a">1</text>
  <text x="64" y="100" font-family="monospace" font-size="12" fill="#45475a">2</text>
  <text x="64" y="120" font-family="monospace" font-size="12" fill="#45475a">3</text>
  <text x="64" y="140" font-family="monospace" font-size="12" fill="#45475a">4</text>
  <text x="64" y="160" font-family="monospace" font-size="12" fill="#45475a">5</text>
  <text x="64" y="180" font-family="monospace" font-size="12" fill="#45475a">6</text>
  <text x="64" y="200" font-family="monospace" font-size="12" fill="#45475a">7</text>
  <text x="64" y="220" font-family="monospace" font-size="12" fill="#45475a">8</text>
  <text x="64" y="240" font-family="monospace" font-size="12" fill="#45475a">9</text>

  <!-- Code content -->
  <text x="92" y="80" font-family="monospace" font-size="13" fill="#cdd6f4">
    <tspan fill="#cba6f7">const</tspan> <tspan fill="#fab387">developer</tspan> <tspan fill="#cdd6f4">= {</tspan>
  </text>
  <text x="112" y="100" font-family="monospace" font-size="13" fill="#cdd6f4">
    <tspan fill="#89b4fa">name</tspan><tspan fill="#f5e0dc">:</tspan> <tspan fill="#a6e3a1">'Christyan Roberto Silva'</tspan><tspan fill="#f5e0dc">,</tspan>
  </text>
  <text x="112" y="120" font-family="monospace" font-size="13" fill="#cdd6f4">
    <tspan fill="#89b4fa">role</tspan><tspan fill="#f5e0dc">:</tspan> <tspan fill="#a6e3a1">'Estudante de ADS'</tspan><tspan fill="#f5e0dc">,</tspan>
  </text>
  <text x="112" y="140" font-family="monospace" font-size="13" fill="#cdd6f4">
    <tspan fill="#89b4fa">location</tspan><tspan fill="#f5e0dc">:</tspan> <tspan fill="#a6e3a1">'Sao Paulo, Brasil'</tspan><tspan fill="#f5e0dc">,</tspan>
  </text>
  <text x="112" y="160" font-family="monospace" font-size="13" fill="#cdd6f4">
    <tspan fill="#89b4fa">stack</tspan><tspan fill="#f5e0dc">:</tspan> <tspan fill="#f5e0dc">[</tspan><tspan fill="#a6e3a1">'React'</tspan><tspan fill="#f5e0dc">,</tspan> <tspan fill="#a6e3a1">'Node.js'</tspan><tspan fill="#f5e0dc">,</tspan> <tspan fill="#a6e3a1">'Next.js'</tspan><tspan fill="#f5e0dc">]</tspan><tspan fill="#f5e0dc">,</tspan>
  </text>
  <text x="112" y="180" font-family="monospace" font-size="13" fill="#cdd6f4">
    <tspan fill="#89b4fa">mindset</tspan><tspan fill="#f5e0dc">:</tspan> <tspan fill="#a6e3a1">'Vibranium'</tspan><tspan fill="#f5e0dc">,</tspan>
  </text>
  <text x="112" y="200" font-family="monospace" font-size="13" fill="#cdd6f4">
    <tspan fill="#89b4fa">mission</tspan><tspan fill="#f5e0dc">:</tspan> <tspan fill="#a6e3a1">'Estagiario / Trainee em ADS'</tspan><tspan fill="#f5e0dc">,</tspan>
  </text>
  <text x="112" y="220" font-family="monospace" font-size="13" fill="#cdd6f4">
    <tspan fill="#89b4fa">wakanda</tspan><tspan fill="#f5e0dc">:</tspan> <tspan fill="#fab387">true</tspan>
  </text>
  <text x="92" y="240" font-family="monospace" font-size="13" fill="#cdd6f4">
    <tspan fill="#cdd6f4">}</tspan>
  </text>

  <!-- Blinking cursor -->
  <rect x="100" y="230" width="2" height="16" fill="#C6A664" opacity="0.8"/>

  <!-- Status bar -->
  <rect x="0" y="308" width="820" height="32" rx="0" fill="#C6A664"/>
  <text x="16" y="329" font-family="monospace" font-size="11" fill="#11111b" font-weight="bold">main</text>
  <text x="60" y="329" font-family="monospace" font-size="11" fill="#11111b">UTF-8</text>
  <text x="120" y="329" font-family="monospace" font-size="11" fill="#11111b">TypeScript</text>
  <text x="200" y="329" font-family="monospace" font-size="11" fill="#11111b">LF</text>
  <text x="240" y="329" font-family="monospace" font-size="11" fill="#11111b">Ln 9, Col 1</text>
  <text x="800" y="329" font-family="monospace" font-size="11" fill="#11111b" text-anchor="end">Wakanda Forever</text>
</svg>
